<button
	class="symptomButton"
	[ngClass]="{ '-selected': isSelected() }"
>
	<div class="symptomButton_content">
		<span class="symptomButton_emoji">{{ symptomEmoji() }}</span>
		<span class="symptomButton_text">{{ symptomText() }}</span>
		<svg
			class="symptomButton_icon"
			lucideChevronRight
			aria-hidden="true"
		/>
	</div>
</button>
