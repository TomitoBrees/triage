<section class="patientAnswers">
	<button
		class="patientAnswers_toggle"
		type="button"
		[attr.aria-expanded]="open()"
		(click)="toggle()"
	>
		<span class="patientAnswers_title">{{ heading() }}</span>
		<span class="patientAnswers_count">{{ countLabel() }}</span>
		<span class="patientAnswers_action">{{ actionLabel() }}</span>
	</button>
	@if (open()) {
		<div class="patientAnswers_list">
			@for (row of rows(); track row.question) {
				<div class="patientAnswers_row">
					<span class="patientAnswers_question">{{ row.question }}</span>
					<span class="patientAnswers_answer">{{ row.answer }}</span>
				</div>
			} @empty {
				<p class="patientAnswers_empty">Aucune réponse enregistrée.</p>
			}
		</div>
	}
</section>
