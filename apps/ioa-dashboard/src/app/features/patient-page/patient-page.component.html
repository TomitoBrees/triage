@if (patient(); as patient) {
	<article class="patientPage">
		<app-patient-page-header
			[patient]="patient"
			(statusChange)="updateStatus($event)"
			(frenchChange)="updateFrench($event)"
		/>
		<app-patient-summary [patient]="patient" />
		<app-patient-pain-scale [patient]="patient" />
		<app-patient-answers
			heading="Questions communes"
			[questions]="commonQuestions"
			[answers]="patient.sharedAnswers ?? {}"
		/>
		@if (specificQuestions().length) {
			<app-patient-answers
				heading="Questions spécifiques"
				[questions]="specificQuestions()"
				[answers]="patient.specificAnswers ?? {}"
			/>
		}
		<app-patient-iao-note
			[note]="patient.iaoNote"
			(noteChange)="updateNote($event)"
		/>
	</article>
} @else if (notFound()) {
	<p class="patientPage_notFound">Patient introuvable.</p>
}
