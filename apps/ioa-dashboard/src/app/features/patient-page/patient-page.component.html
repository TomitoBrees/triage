@if (patient(); as patient) {
	<article class="patientPage">
		<app-patient-page-header
			[patient]="patient"
			(statusChange)="updateStatus($event)"
			(frenchChange)="updateFrench($event)"
		/>
		<app-patient-summary [patient]="patient" />
	</article>
} @else if (notFound()) {
	<p class="patientPage_notFound">Patient introuvable.</p>
}
